server.port=8080
spring.liquibase.change-log=/db/changelog/db.changelog-master.xml
spring.datasource.url=jdbc:h2:file:./data/printersdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
logging.level.org.qw3rtrun=TRACE

# Plan item D3 - the actuator, actually turned on.
#
# Boot exposes only /actuator/health by default, so the Modulith actuator and observability
# dependencies this build has carried since the modules were declared had nothing to show. The
# whole of /actuator/** is ADMIN-only in SecurityConfiguration, which is what makes exposing more
# than health a reasonable thing to do.
#
# A liveness probe would be the one reason to carve an anonymous exception out of that rule; there
# is nothing probing this farm today, so the rule stays simple until something does.
management.endpoints.web.exposure.include=health,info,metrics,modulith,mappings
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
