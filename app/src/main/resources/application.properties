server.port=8080
spring.liquibase.change-log=/db/changelog/db.changelog-master.xml
spring.datasource.url=jdbc:h2:file:./data/printersdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
logging.level.org.qw3rtrun=TRACE

# A note about thread names in this log, because they read as noise otherwise.
#
# Since issue #54 each machine has two threads of its own - "p3d-printer-<uuid>" carries its
# aggregate and "p3d-listener-<uuid>" carries the listeners it feeds - so a stalled farm can be
# read off a thread dump and attributed to one printer. Boot's default console pattern prints the
# thread as %15.15t, and Logback truncates an over-long field from the *front*, so what shows up
# here is the last fifteen characters of the UUID and nothing that says which half it is.
#
# Left alone deliberately: widening the column means pinning Boot's whole console pattern in this
# file, which then has to be kept in step with Boot. A thread dump - jcmd <pid> Thread.print, or
# the actuator - shows the full names, and that is where this question is actually asked.

# Plan item D3 - the actuator, actually turned on.
#
# Boot exposes only /actuator/health by default, so the Modulith actuator and observability
# dependencies this build has carried since the modules were declared had nothing to show. The
# whole of /actuator/** is ADMIN-only in SecurityConfiguration, which is what makes exposing more
# than health a reasonable thing to do.
#
# A liveness probe would be the one reason to carve an anonymous exception out of that rule; there
# is nothing probing this farm today, so the rule stays simple until something does.
management.endpoints.web.exposure.include=health,info,metrics,modulith,mappings
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
