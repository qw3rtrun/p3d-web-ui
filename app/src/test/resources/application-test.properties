# A throwaway database for tests that boot the assembled application.
#
# A profile overlay, and not an application.properties of its own: a test-scope application.properties
# does not merge with :app's, it *replaces* it on the classpath - which silently drops the Liquibase
# changelog path and leaves Boot looking for a .yaml that was never there. The overlay only states
# what differs.
spring.datasource.url=jdbc:h2:mem:apptestdb;DB_CLOSE_DELAY=-1

# Where an uploaded G-code file's bytes land.
#
# The default is ./data/gcode, beside the operator's own database, relative to whatever directory
# the process started in - which for a Gradle test is the module's. A suite that uploads files must
# not write there, so it is pointed at the build directory, which `gradlew clean` takes away.
#
# Stated here and not per class on purpose: a @TestPropertySource on one test class would fork the
# application context and cost a second boot of the whole farm - see INTEGRATION_TESTS_spec.md 2.2.
p3d.files.root=./build/test-gcode

# The administrator the integration tests sign in as.
#
# Stated here rather than relied on as a default, for two reasons. InitialAdmin's fallback lives in
# :backend:core and is not this module's to depend on; and the account is created only when the
# roster is *empty*, so every test context sharing this in-memory database has to agree about the
# password or the second one to boot would find an account it cannot use.
#
# It is not a secret and could not be: an in-memory database that is discarded when the JVM exits.
p3d.security.initial-admin.username=admin
p3d.security.initial-admin.password=integration-test-admin

# The bytes in both directions, so a failing integration test can be read against the wire.
# ConnectionPolicy is deliberately *not* overridden: no test here waits for a machine to be given
# up on, because the backoff sequence is PrinterReactorRetryTest's subject in :backend:core. An
# unreachable machine is asserted on while it is still CONNECTING, which needs no waiting at all.
logging.level.org.qw3rtrun.p3d.terminal.HostTerminal#traffic=DEBUG
