# A throwaway database for tests that boot the assembled application.
#
# A profile overlay, and not an application.properties of its own: a test-scope application.properties
# does not merge with :app's, it *replaces* it on the classpath - which silently drops the Liquibase
# changelog path and leaves Boot looking for a .yaml that was never there. The overlay only states
# what differs.
spring.datasource.url=jdbc:h2:mem:apptestdb;DB_CLOSE_DELAY=-1
