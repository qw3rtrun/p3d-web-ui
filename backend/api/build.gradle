import org.springframework.boot.gradle.plugin.SpringBootPlugin

/**
 * The `api` submodel: the shared vocabulary every other submodel is written in.
 *
 * It names no framework. That is the point of it - both the web side and the persistence side
 * depend on this module, and neither should reach the other's framework through it. The one Spring
 * reference is the Modulith annotation in package-info.java, and it is compileOnly.
 *
 * `:gcode` is the one project dependency, and it is `api` rather than `implementation` so that it
 * travels with this module: the dependency rule is backend -> terminal -> gcode, and the
 * vocabulary of a Marlin farm *is* G-code. See the note in api/package-info.java.
 */
plugins {
    id 'p3d.java-conventions'
    // `api` rather than `implementation` below: PrinterControl's signatures use Publisher, so every
    // module that depends on this one needs it on its own compile path.
    id 'java-library'
    id 'org.springframework.boot' version "$spring_boot_version" apply false
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "org.jetbrains.kotlin.jvm" version "$kotlin_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.modulith:spring-modulith-bom:$springModulithVersion"
    }
}

dependencies {
    // The protocol, and the model this module's messages are written in. `api` because
    // PrinterControl's signatures are GRq and HeaterReading: every module that depends on this one
    // needs them on its own compile path, which is what "terminal may propagate gcode's models to
    // backend" means in a build file.
    api project(':gcode')

    // The interop SPI that Mono and Flux implement - not a framework, and the only way to say
    // "asynchronous" in this module's signatures without putting Reactor on every dependent's
    // compile path. See api/control/PrinterControl.
    api 'org.reactivestreams:reactive-streams'

    // Only for the @ApplicationModule in package-info.java. The declaration is read out of the
    // bytecode by the verification in :app, which has Modulith on its own classpath.
    compileOnly 'org.springframework.modulith:spring-modulith-api'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
