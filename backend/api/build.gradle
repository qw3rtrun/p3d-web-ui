plugins {
    id 'p3d.java-conventions'
    id 'org.springframework.boot' version "$spring_boot_version"
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
}

dependencies {
    implementation project(':backend:core')
    implementation project(':backend:terminal')
    implementation project(':gcode')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Explicit Jackson dependency for ObjectMapper and JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // The REST surface binds Kotlin data classes (marlin.command.*) as @RequestBody. Jackson
    // cannot construct one without this module: their properties are `val`, so there is nothing
    // to set after a no-arg construction, and Kotlin does not emit java parameter names by
    // default for the databind ParameterNamesModule to match against. Spring Boot registers
    // KotlinModule automatically once it is on the classpath.
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
