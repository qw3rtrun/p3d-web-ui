# A throwaway database for this module's tests, against the real changelogs.
#
# One file, where there used to be four - printer-management, files, jobs and identity each had
# their own pointing at their own in-memory database and their own schema slice. One Gradle module
# means one test classpath, so they share this.
spring.datasource.url=jdbc:h2:mem:coredb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.liquibase.change-log=classpath:db/changelog/core-test.xml
spring.liquibase.enabled=true
