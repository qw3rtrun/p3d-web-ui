import org.springframework.boot.gradle.plugin.SpringBootPlugin

/**
 * The `files` submodel: stored G-code, content-addressed.
 *
 * It depends on `:gcode` for one thing - reading comments out of a slicer's header - and on no
 * application module but `api`. No WebFlux: the upload and download endpoints belong to `frontend`,
 * which is where `doc/sub_boundaries.txt` puts REST surfaces, and the bytes cross as
 * `Publisher<ByteBuffer>`.
 */
plugins {
    id 'p3d.java-conventions'
    id 'org.springframework.boot' version "$spring_boot_version" apply false
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.modulith:spring-modulith-bom:$springModulithVersion"
    }
}

dependencies {
    implementation project(':backend:api')

    // Comments are read with GTokenizer rather than a regex of this module's own: there is one
    // reader of G-code text in this repository and it is not here.
    implementation project(':gcode')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.springframework.boot:spring-boot-starter-liquibase"
    implementation 'io.projectreactor:reactor-core'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation("org.springframework.boot:spring-boot-starter-liquibase-test")
}
