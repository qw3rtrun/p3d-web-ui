# This module's own schema only: :app is what assembles every module's changelog into one.
spring.datasource.url=jdbc:h2:mem:filesdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.liquibase.change-log=classpath:db/changelog/gcode-files.xml
spring.liquibase.enabled=true
