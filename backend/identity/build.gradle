import org.springframework.boot.gradle.plugin.SpringBootPlugin

/**
 * The `identity` submodel: who may use this farm - plan item D3.
 *
 * It owns one table and one question: "is this person who they say they are, and what are they
 * allowed to do". It has no web layer. Authenticating a *request* is the frontend's business,
 * because that is where a request exists; this module only knows users.
 *
 * `spring-security-crypto` and not the security starter. The starter brings a servlet or WebFlux
 * filter chain, which this module must not have - what it needs is the hashing, so that a raw
 * password can be taken at the boundary and nothing downstream can store one by accident.
 */
plugins {
    id 'p3d.java-conventions'
    id 'org.springframework.boot' version "$spring_boot_version" apply false
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
        mavenBom "org.springframework.modulith:spring-modulith-bom:$springModulithVersion"
    }
}

dependencies {
    implementation project(':backend:api')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.springframework.boot:spring-boot-starter-liquibase"
    runtimeOnly 'com.h2database:h2'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    // Hashing only - see the note above. No filter chain, no web.
    implementation 'org.springframework.security:spring-security-crypto'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation("org.springframework.boot:spring-boot-starter-liquibase-test")
}
