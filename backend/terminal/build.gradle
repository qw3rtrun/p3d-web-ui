import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'p3d.java-conventions'
    id 'org.springframework.boot' version "$spring_boot_version" apply false
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
}

dependencies {
    implementation project(':backend:api')
    implementation project(':gcode')

    // import a BOM
    implementation platform('io.projectreactor:reactor-bom:2025.0.7')

    // define dependencies without versions
    implementation 'io.projectreactor:reactor-core'
    implementation 'io.projectreactor.netty:reactor-netty-core'
    // https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    implementation 'ch.qos.logback:logback-classic'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}

/**
 * Ask a running printer for a temperature report over the real terminal stack.
 *
 * Hand-run only - it needs a listener on the far end, so it is deliberately not wired into `check`.
 * Point it elsewhere with -PprobeHost=... -PprobePort=...
 */
tasks.register('probeTemperature', JavaExec) {
    group = 'verification'
    description = 'Ask a Marlin emulator (default localhost:8099) for a temperature report through TerminalManager.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.EmulatorTemperatureProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
            (findProperty('probeTimeout') ?: '10').toString(),
    ]
}

/**
 * Upload a file to the card twice - once exclusively, once shared - while something competes for
 * the wire, and report whether anything leaked into it.
 *
 * Hand-run only, like the probe above: it writes to the card on the far end, so it is deliberately
 * not wired into `check`. The shared run is the control and is meant to fail.
 */
/**
 * Attach twice to one running firmware and measure what the second session loses - issue #60.
 *
 * Hand-run only: the case it produces needs a far end whose line counter is where the previous
 * client left it, which no mock in the suite can be.
 */
tasks.register('probeResendOnReconnect', JavaExec) {
    group = 'verification'
    description = 'Reconnect to a firmware that still remembers the last session, and report which blocks were abandoned.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.ResendOnReconnectProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
    ]
}

/**
 * Start a print as M23+M24 and as one M32, and vary the filename under M32. Issue #109.
 *
 * Hand-run only, like the probes around it: it writes files to the card, prints them and deletes
 * them again. -PprobeOrder=pairfirst|m32first|names picks the run; `names` is the one that found
 * why a print is still two commands.
 */
tasks.register('probeSdPrint', JavaExec) {
    group = 'verification'
    description = 'Compare starting an SD print as M23+M24 against one M32, and measure what M32 does with the filename.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.SdPrintProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
            (findProperty('probeOrder') ?: 'pairfirst').toString(),
    ]
}

tasks.register('probeSdUpload', JavaExec) {
    group = 'verification'
    description = 'Upload to the SD card through the real transport with a competing source, and measure what got in.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.SdUploadProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
    ]
}

/**
 * Push a firmware's line counter to a known value and then send it a fresh session's first
 * block - issue #60's case, produced rather than waited for. Hand-run.
 */
tasks.register('probeResendDrift', JavaExec) {
    group = 'verification'
    description = 'Measure what a firmware with a pushed last_N answers to N1, and whether M110 N0 repairs it.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.ResendDriftProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
    ]
}

/**
 * Measure what M500-M504 and the bare single-setting queries behind them actually answer -
 * issue #88. Hand-run only, like the probes above: it writes to the machine's live memory and,
 * once, to its EEPROM.
 */
tasks.register('probeSettings', JavaExec) {
    group = 'verification'
    description = 'Measure what Marlin\'s EEPROM settings commands (M500-M504) answer over a plain socket.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.SettingsProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
    ]
}

/**
 * Recapture `gcode/src/test/resources/marlin-replies.txt` - the reply corpus
 * `GReplyCorpusTest` censuses - from a running printer. Hand-run, and a deliberate act: it
 * replaces one session's evidence with another's, so review the diff and then regenerate the
 * census snapshot beside it.
 *
 * It writes `test.gco` to the card on the far end and deletes it again.
 */
tasks.register('probeReplyCorpus', JavaExec) {
    group = 'verification'
    description = 'Recapture the Marlin reply corpus from a printer (default localhost:8099).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.qw3rtrun.p3d.terminal.ReplyCorpusProbe'
    args = [
            (findProperty('probeHost') ?: 'localhost').toString(),
            (findProperty('probePort') ?: '8099').toString(),
    ]
}
