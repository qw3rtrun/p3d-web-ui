plugins {
    id 'p3d.java-conventions'
    id 'org.springframework.boot' version "$spring_boot_version"
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
    id 'org.siouan.frontend-jdk21' version '10.0.0'
}

group = 'org.qw3rtrun.p3d'
version = '0.0.1-SNAPSHOT'

def nodeVersionProp = "24.21.0"

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:$springModulithVersion"
    }
}

dependencies {
    // The `frontend` submodel: REST and SSE, the Thymeleaf controllers, and the Vue build below.
    implementation project(':backend:api')
    implementation project(':backend:core')
    implementation project(':gcode')

    // The REST surface binds Kotlin data classes (marlin.command.*) as @RequestBody; Jackson cannot
    // construct one without this module. Moved here with the controllers that need it.
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'

    // Only for the @ApplicationModule in package-info.java - see backend/api/build.gradle.
    compileOnly 'org.springframework.modulith:spring-modulith-api'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

frontend {
    //nodeDistributionProvided.set(true)
    nodeVersion = "24.21.0"
    packageJsonDirectory = file("${projectDir}/src/frontend")
    nodeInstallDirectory = file("${projectDir}/.node")
    assembleScript.set("run build")
//    cleanScript.set("run clean")
//    checkScript.set("run check")
}

tasks.register("copyVueFiles") {
    doLast {
        copy {
            from "${buildDir}/dist/"
            into "${buildDir}/resources/main/static"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn("copyVueFiles")
}

tasks.named('test') {
    useJUnitPlatform()
}
