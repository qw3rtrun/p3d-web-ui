plugins {
    id 'p3d.java-conventions'
    id 'org.springframework.boot' version "$spring_boot_version"
    id 'io.spring.dependency-management' version "$spring_dependencies_plugin_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
    id 'org.siouan.frontend-jdk21' version '10.0.0'
}

group = 'org.qw3rtrun.p3d'
version = '0.0.1-SNAPSHOT'

def nodeVersionProp = "24.21.0"

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:$springModulithVersion"
    }
}

dependencies {
    // The `frontend` submodel: REST and SSE, the Thymeleaf controllers, and the Vue build below.
    implementation project(':backend:api')

    // The protocol. The controllers translate a request body into Marlin commands before handing
    // them to PrinterControl - see frontend/command - so this module names :gcode on purpose. It
    // arrives transitively through :backend:api as well; it is declared here because code in this
    // module imports it, and an import should be a dependency you can see in the build file.
    //
    // Nothing here *binds* a :gcode class from JSON: the request bodies are this module's own
    // records, so there is still no jackson-module-kotlin on this classpath.
    implementation project(':gcode')

    // :backend:core is deliberately absent. The controllers reach the printer runtime through
    // PrinterControl, an interface in :backend:api - rule 1 of doc/sub_boundaries.txt.

    // Only for the @ApplicationModule in package-info.java - see backend/api/build.gradle.
    compileOnly 'org.springframework.modulith:spring-modulith-api'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Plan item D3. Authenticating a request needs a request, so the filter chain lives in the one
    // submodel that has one. Who the people are is :backend:identity's, reached through
    // FarmUserDirectory in api - this module does not name it.
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // The WebFlux adapter for the session store that :backend:identity keeps in the database.
    // Core only - the JDBC half belongs to the module that owns the table.
    implementation 'org.springframework.session:spring-session-core'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

frontend {
    //nodeDistributionProvided.set(true)
    nodeVersion = "24.21.0"
    packageJsonDirectory = file("${projectDir}/src/frontend")
    nodeInstallDirectory = file("${projectDir}/.node")
    assembleScript.set("run build")
//    cleanScript.set("run clean")
//    checkScript.set("run check")
}

tasks.register("copyVueFiles") {
    doLast {
        copy {
            from "${buildDir}/dist/"
            into "${buildDir}/resources/main/static"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn("copyVueFiles")
}

tasks.named('test') {
    useJUnitPlatform()
}
