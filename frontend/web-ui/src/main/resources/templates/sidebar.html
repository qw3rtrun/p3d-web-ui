<!DOCTYPE html>
<html lang="en">

<body>
<div class="container-scroller">
    <div class="container-fluid page-body-wrapper">
        <nav th:fragment="common_sidebar(active)" class="sidebar sidebar-offcanvas" id="sidebar">
            <ul class="nav">
                <li class="nav-item" th:classappend="${active == 'dashboard' ? 'active' : ''}">
                    <a class="nav-link" th:href="@{/dashboard.html}">
                        <i class="mdi mdi-grid-large menu-icon"></i>
                        <span class="menu-title">Dashboard Monitor</span>
                    </a>
                </li>
                <li class="nav-item nav-category">Machines</li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="collapse" href="#list-fdm"
                       th:attr="aria-expanded=${active == 'fdms' ? 'true' : 'false'}" aria-controls="list-fdm">
                        <i class="menu-icon mdi mdi-floor-plan"></i>
                        <span class="menu-title">FDM 3D Printers</span>
                        <i class="menu-arrow"></i>
                    </a>
                    <div class="collapse" th:classappend="${active == 'fdms' ? 'show' : ''}" id="list-fdm">
                        <ul class="nav flex-column sub-menu">
                            <li class="nav-item" th:each="printer : ${printers}">
                                <a class="nav-link" th:href="@{|/printers/${printer.uuid}|}">[[${printer.name}]]</a>
                            </li>
                            <li><a class="nav-link" href="/printers/add.html"><i class="bi bi-plus"></i> Add</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>

</html>
